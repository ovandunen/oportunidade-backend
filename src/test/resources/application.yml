quarkus:
  rest-client:
    logging:
      scope: request-response
      body-limit: 5000
  log:
    category:
      "org.jboss.resteasy.reactive.client.logging":
        level: DEBUG
      "ao.co.oportunidade.odoo":
        level: DEBUG

  hibernate-orm:
    database:
      generation: drop-and-create
    log:
      sql: true

flyway:
  migrate-at-start: false

odoo:
  webhook:
    key: ${ODOO_WEBHOOK_KEY}
    url: ${ODOO_WEBHOOK_URL}