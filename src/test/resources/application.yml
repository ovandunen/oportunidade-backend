quarkus:
  # Test Database - Create tables on startup
  hibernate-orm:
    database:
      generation: drop-and-create
    log:
      sql: false  # Set to true when debugging

  # Disable Flyway in tests (conflicts with drop-and-create)
  flyway:
    migrate-at-start: false

  # Test logging
  log:
    level: INFO
    category:
      "ao.co.oportunidade":
        level: DEBUG

# Test values for webhooks
webhook:
  secret: test-secret
  max-retry-count: 2
  retry-delay-seconds: 1

odoo:
  webhook:
    key: test-webhook-key
    url: http://localhost:8080/test-webhook

# Document access configuration (same as production)
document:
  access:
    duration-hours: 72
    max-downloads:
      basic: 10
      standard: 50
      premium: 200

# NOTE: NO JWT configuration here!
# Document access tokens use simple random strings, not JWT.
# OAuth2 JWT will be added later for API authentication (different purpose).