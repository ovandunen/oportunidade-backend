# Development Profile Configuration
# This file is automatically used when running in dev mode (./mvnw quarkus:dev)
# Override with environment variables or system properties as needed

quarkus:
  # Database Configuration - Development
  datasource:
    db-kind: postgresql
    username: postgres
    password: postgres
    jdbc:
      url: jdbc:postgresql://localhost:5432/odoo_payments
      driver: org.postgresql.Driver
  
  # Hibernate Configuration - Development
  hibernate:
    orm:
      log:
        sql: true
      sql-load-script: no-file
  
  # Flyway Configuration - Development
  flyway:
    migrate-at-start: true
    baseline-on-migrate: true
    baseline-version: 0

  # AppyPay Emulator - Development (points to local emulator on port 8085)
  rest-client:
    appypay-api:
      url: http://localhost:8085/emulator/appypay

  devservices:
    enabled=false:

# Odoo Configuration - Development
odoo:
  url: http://localhost:8069
  database: odoo_dev
  username: admin
  password: admin
  timeout: 30000
  max-retries: 3

# JWT Configuration - Development
jwt:
  private-key-file: src/main/resources/privateKey.pem
  issuer: recruiting-agency-backend

# Application Configuration - Development
app:
  base-url: http://localhost:8080
  environment: development

# Retry Configuration
retry:
  max-attempts: 5
  initial-delay-ms: 1000
  max-delay-ms: 16000

# Logging - Development
"%dev":
  quarkus:
    log:
      level: DEBUG
      category:
        "ao.co.oportunidade": DEBUG
        "solutions.envision": DEBUG
        "org.flywaydb": INFO
        "org.hibernate": INFO