quarkus:
  # Micrometer Configuration
  micrometer:
    enabled: true
    binder:
      # JVM Metriken
      jvm: true
      # System Metriken
      system: true
      # HTTP Metriken
      http-server:
        enabled: true
      # Vertx Metriken
      vertx:
        enabled: true

    export:
      prometheus:
        enabled: true
        path: /q/metrics  # Metrics endpoint
        default-registry: true

    binder-enabled-default: true

  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    jdbc:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/odoo_payments}

    # Hibernate Configuration
  hibernate:
    orm:
      # Don't let Hibernate manage schema - Flyway does this
      database:
        generation: none
      log:
        sql: true
      sql-load-script: no-file

  # Flyway Configuration
  flyway:
    migrate-at-start: true
    baseline-on-migrate: true
    baseline-version: 0

  # HTTP Configuration
  http:
    port: 8080
    auth:
      permission:
        webhooks-public:
          paths: /webhooks/*
          policy: permit
        health-public:
          paths: /q/*
          policy: permit
    cors:
      enabled: true
      origins:
        - "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
      headers: Authorization,Content-Type,Accept

  # Logging Configuration
  logging:
    level:
      root: INFO
      ao.co.oportunidade.webhook: DEBUG
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"

  # Health Check Configuration
  smallrye-health:
    ui:
      enable: true

  # OpenAPI / Swagger UI Configuration (for third-party REST consumers)
  swagger-ui:
    enable: true
    always-include: true
  smallrye-openapi:
    # OpenAPI spec available at /api-docs/openapi (JSON) and /api-docs/openapi?format=yaml (YAML)
    path: /api-docs/openapi

  # OIDC (Keycloak Dev Services in %dev — see application-dev.yml). Disabled by default for CI / plain JVM runs.
  oidc:
    enabled: ${OIDC_ENABLED:false}
    application-type: service
    auth-server-url: ${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/quarkus}
    client-id: ${OIDC_CLIENT_ID:backend-service}
    credentials:
      secret: ${OIDC_CLIENT_SECRET:secret}
    roles:
      role-claim-path: ${OIDC_ROLE_CLAIM_PATH:realm_access/roles}

  rest-client:
    appypay-emulator:
      url: ${APPYPAY_EMULATOR_URL:http://localhost:8085}

# Payment reference issuance (text & QR – alternative to AppyPay reference flow)
payment:
  reference:
    entity-code: ${PAYMENT_REFERENCE_ENTITY:00123}
    validity-hours: ${PAYMENT_REFERENCE_VALIDITY_HOURS:72}
  initiation:
    session-expiry-hours: ${PAYMENT_SESSION_EXPIRY_HOURS:24}

# Webhook Configuration
webhook:
  max-retry-count: ${WEBHOOK_MAX_RETRY:3}
  retry-delay-seconds: ${WEBHOOK_RETRY_DELAY:60}
  secret: ${WEBHOOK_SECRET:}

# Odoo REST API Client Configuration
odoo-api/mp-rest/url: http://localhost:8000

# Odoo XML-RPC Configuration (for document access)
odoo:
  url: ${ODOO_URL:http://localhost:8069}
  database: ${ODOO_DATABASE:odoo_dev}
  username: ${ODOO_USERNAME:admin}
  password: ${ODOO_PASSWORD:admin}
  timeout: ${ODOO_TIMEOUT:30000}
  max-retries: ${ODOO_MAX_RETRIES:3}
  webhook:
    key: ${ODOO_WEBHOOK_KEY}
    url: ${ODOO_WEBHOOK_URL}

# Reactive Messaging Configuration for Webhook Processing
mp:
    messaging:
      incoming:
        webhook-events-in:
          connector: smallrye-in-memory
      outgoing:
        webhook-events-out:
          connector: smallrye-in-memory
          destination: webhook-events-in

# JWT Token Configuration
jwt:
  secret: ${JWT_SECRET}
  private-key-file: ${JWT_PRIVATE_KEY_FILE:src/main/resources/privateKey.pem}
  issuer: ${JWT_ISSUER:recruiting-agency-backend}
  expiration:
    basic: ${TOKEN_EXPIRATION_BASIC:24}
    standard: ${TOKEN_EXPIRATION_STANDARD:48}
    premium: ${TOKEN_EXPIRATION_PREMIUM:72}
    enterprise: ${TOKEN_EXPIRATION_ENTERPRISE:168}

# Retry Configuration
retry:
  max-attempts: ${RETRY_MAX_ATTEMPTS:5}
  initial-delay-ms: ${RETRY_INITIAL_DELAY_MS:1000}
  max-delay-ms: ${RETRY_MAX_DELAY_MS:16000}

# Application Configuration
app:
  base-url: ${BASE_URL:http://localhost:8080}
  environment: ${ENVIRONMENT:development}

# Document Access Configuration (legacy - to be removed)
document:
  access:
    duration:
      hours: 72
  max:
    downloads:
      basic: 10
      standard: 50
      premium: 200